name: Edwin CRM - barreras de lanzamiento
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  launch-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar suite unitaria completa (regresiones positivas, negativas y aislamiento)
        run: npm run test:unit
      - name: Revisar 10 barreras comerciales estaticas
        run: node scripts/launch-audit.mjs
      - name: Ejecutar regresiones positivas y negativas del auditor A21-A30
        run: node --test tests/launch-audit-ten.test.mjs
      - name: Ejecutar regresiones comerciales A11-A20
        run: node --test tests/launch-commercial-ten.test.js
      - name: Ejecutar regresiones de demo A01-A10
        run: node --test tests/launch-demo-ten.test.mjs
      - name: Ejecutar regresiones del simulador A31-A40
        run: node --test tests/launch-followup-ten.test.mjs
      - name: Ejecutar regresiones de registro y onboarding A41-A50
        run: node --test tests/launch-signup-ten.test.js
      - name: Verificar respuesta RPC de onboarding valida, malformada y sin sesion
        run: node --test tests/onboarding-rpc-shape.test.mjs
      - name: Verificar retorno de demo y aislamiento
        run: node --test tests/demo-end-navigation.test.mjs tests/demo-stage-mobile-wrap.test.mjs tests/demo-error-announcement.test.mjs tests/demo-print-error-context.test.mjs
