name: CRM - pruebas de integración
on:
  pull_request:
    paths:
      - '**/*.js'
      - 'public/**'
      - 'migrations/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/crm-ci.yml'
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis de todos los módulos JavaScript
        run: |
          set -eu
          find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0 | xargs -0 -n 1 node --check
      - name: Pruebas unitarias de todos los módulos
        run: node --test tests/*.test.js
