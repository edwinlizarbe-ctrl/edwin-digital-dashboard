name: Admin GA4 manual provisioning checks
on:
  pull_request:
    paths:
      - 'admin-ga4.js'
      - 'tests/admin-ga4.test.js'
      - 'worker.js'
      - 'public/app.js'
      - '.github/workflows/admin-ga4-check.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and tenant-safe GA4 provisioning
        run: |
          node --check admin-ga4.js
          node --check worker.js
          node --check public/app.js
          node --test tests/admin-ga4.test.js
